services:
  # 데이터 저장소 (S3 대용)
  minio:
    image: minio/minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Iceberg 카탈로그 DB
  postgres:
    image: postgres:15
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iceberg_catalog

  # 메시지 큐 (Kafka) — latest 는 KRaft 전용이라 ZK 조합은 버전 고정
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
        
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui: 
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8632:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  api-gateway:
    image: kong:latest
    container_name: api-gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8106
      KONG_LOG_LEVEL: info
    ports:
      - "8106:8106"
    volumes:
      - ./kong.yml:/usr/local/kong/kong.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # 1. Search Service (검색 Mock 서비스)
  search-consumer-mock:
    build:
      context: ./consumer_mock_service
    image: consumer-mock-service:latest
    container_name: search-consumer-mock
    ports:
      - "8101:8000"
    environment:
      - SERVICE_LABEL=검색서비스
      - KAFKA_CONSUMER_GROUP=search-to-be
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_READY_TOPIC=mail.ready
      - SERVING_SERVICE_URL=http://api-gateway:8106
      - MY_API_KEY=search-secret-key-456
    depends_on:
      - kafka
      - api-gateway
    restart: always

  # 2. Mobile Service (모바일 Mock 서비스)
  mobile-consumer-mock:
    image: consumer-mock-service:latest
    container_name: mobile-consumer-mock
    ports:
      - "8102:8000"
    environment:
      - SERVICE_LABEL=모바일서비스
      - KAFKA_CONSUMER_GROUP=mobile-to-be
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_READY_TOPIC=mail.ready
      - SERVING_SERVICE_URL=http://api-gateway:8106
      - MY_API_KEY=mobile-secret-key-123
    depends_on:
      - kafka
      - api-gateway
      - search-consumer-mock
    restart: always

  # 3. Graph Service (Graph Mock 서비스)
  graph-consumer-mock:
    image: consumer-mock-service:latest
    container_name: graph-consumer-mock
    ports:
      - "8103:8000"
    environment:
      - SERVICE_LABEL=Graph서비스
      - KAFKA_CONSUMER_GROUP=graph-to-be
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_READY_TOPIC=mail.ready
      - SERVING_SERVICE_URL=http://api-gateway:8106
      - MY_API_KEY=graph-secret-key-789
    depends_on:
      - kafka
      - api-gateway
      - search-consumer-mock
    restart: always

volumes:
  minio_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data: