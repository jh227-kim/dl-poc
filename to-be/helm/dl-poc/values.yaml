# Default values for dl-poc. (Verification & Testing Environment)
# This is a YAML-formatted file.

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------
# Infrastructure Components (ns-dl-infra)
# ----------------------------------------------------
postgres:
  enabled: true
  namespace: "ns-dl-infra"
  image: postgres:15
  persistence:
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

minio:
  enabled: true
  namespace: "ns-dl-infra"
  image: minio/minio
  rootUser: admin
  rootPassword: password
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

zookeeper:
  enabled: true
  namespace: "ns-dl-pipeline"
  image: confluentinc/cp-zookeeper:7.5.3
  persistence:
    size: 5Gi
    storageClassName: ""
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

kafka:
  enabled: true
  namespace: "ns-dl-pipeline"
  image: confluentinc/cp-kafka:7.5.3
  persistence:
    size: 10Gi
    storageClassName: ""
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

readyZookeeper:
  enabled: true
  namespace: "ns-dl-serving"
  image: confluentinc/cp-zookeeper:7.5.3
  persistence:
    size: 5Gi
    storageClassName: ""
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

readyKafka:
  enabled: true
  namespace: "ns-dl-serving"
  image: confluentinc/cp-kafka:7.5.3
  persistence:
    size: 5Gi
    storageClassName: ""
  replicas: 1
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

kafkaUi:
  enabled: true
  namespace: "ns-dl-infra"
  image: provectuslabs/kafka-ui:latest
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ----------------------------------------------------
# External GCP Services Configuration
# Active ONLY when respective component.enabled is 'false'.
# ----------------------------------------------------
externalPostgres:
  host: "cloud-sql-postgres-ip"
  port: 5432
  user: "admin"
  password: "password"
  database: "iceberg_catalog"

externalMinio:
  # GCP Cloud Storage (GCS) S3-compatible XML API endpoint
  endpoint: "https://storage.googleapis.com"
  accessKey: "gcp-gcs-hmac-access-key"
  secretKey: "gcp-gcs-hmac-secret-key"

externalKafka:
  # GCP Managed Service for Apache Kafka / Confluent Cloud Bootstrap server
  bootstrapServers: "gcp-managed-kafka-bootstrap-servers:9092"

externalReadyKafka:
  # GCP Managed Service for Apache Kafka / Confluent Cloud Ready Topic Bootstrap server
  bootstrapServers: "gcp-managed-ready-kafka-bootstrap-servers:9092"

# ----------------------------------------------------
# Core Streaming Pipeline (ns-dl-pipeline)
# ----------------------------------------------------
sparkMailIngest:
  namespace: "ns-dl-pipeline" 
  image: spark-mail-ingest:latest
  sparkCheckpointLocation: "s3a://warehouse/.spark-checkpoints/mail-ingest"
  kafkaDlqTopic: "mail.events.dlq"
  replicas: 1
  # Spark Master (local[1] for dev, k8s://... for prod)
  sparkMaster: "local[1]"
  # Executor Sizing (Active only when sparkMaster is k8s://...)
  sparkExecutorInstances: 1
  sparkExecutorCores: "1"
  sparkExecutorMemory: "1Gi"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

sparkDlqProcessor:
  namespace: "ns-dl-pipeline" 
  image: spark-dlq-processor:latest
  kafkaDlqTopic: "mail.events.dlq"
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ----------------------------------------------------
# Core Serving Applications (ns-dl-serving)
# ----------------------------------------------------
servingService:
  namespace: "ns-dl-serving" 
  image: serving-service:latest
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

apiGateway:
  namespace: "ns-dl-serving" 
  image: kong:latest
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# ----------------------------------------------------
# Simulator & Testing Tools (ns-dl-mocks)
# ----------------------------------------------------
mocks:
  enabled: true
  namespace: "ns-dl-mocks" 
  image:
    consumerMock: consumer-mock-service:latest
    supplyMock: supply-mock-service:latest
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

dashboard:
  enabled: true
  namespace: "ns-dl-mocks" 
  image: poc-dashboard:latest
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "512Mi"

# ----------------------------------------------------
# Ingress Controller Config (Domain-based routing)
# ----------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    minio: "minio.dl-poc.local"
    kafkaUi: "kafka-ui.dl-poc.local"
    apiGateway: "api.dl-poc.local"
    dashboard: "dashboard.dl-poc.local"
  tls: []
